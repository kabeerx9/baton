# LOCAL SMOKE TEST ONLY. Never use this file in production.
#
# Layered over deploy/compose.prod.yml it adds a throwaway MinIO so the backup
# and restore path can be exercised without cloud credentials:
#
#   docker compose -p baton-deploy-smoke \
#     -f deploy/compose.prod.yml -f deploy/compose.smoke.yml \
#     --env-file deploy/.env.smoke.sample up -d --build
#   curl -k https://localhost/api/health
#   docker compose -p baton-deploy-smoke \
#     -f deploy/compose.prod.yml -f deploy/compose.smoke.yml \
#     --env-file deploy/.env.smoke.sample down -v
#
# Caddy needs no TLS override: with BATON_DOMAIN=localhost it issues a
# certificate from its local CA, so curl needs -k. Ports 80/443 must be free on
# the machine running the smoke test. See docs/deploy.md, "Local smoke test".

services:
  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER in deploy/.env.smoke.sample}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD in deploy/.env.smoke.sample}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 24
    security_opt:
      - no-new-privileges:true
    networks:
      - baton_net

  minio-init:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        mc alias set smoke http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD" &&
        mc mb --ignore-existing "smoke/$$BACKUP_S3_BUCKET"
    security_opt:
      - no-new-privileges:true
    networks:
      - baton_net

volumes:
  minio_data:
