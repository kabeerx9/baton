# Production stack for Baton on one VPS.
#
#   Caddy (80/443, automatic HTTPS) -> baton:5173 (nginx + API in one image)
#   postgres:16-alpine on a named volume, never published to the host
#   backup: nightly pg_dump -> S3-compatible object storage, with retention
#
# Not published to the host: Postgres and the app. Only Caddy binds 80/443.
#
# Run from the repository root (Compose resolves this file's directory as the
# project directory, so paths below are relative to `deploy/`):
#
#   docker compose -f deploy/compose.prod.yml --env-file deploy/.env.production up -d
#
# `--env-file` is required: every value below is interpolated from it, and the
# `:?` entries stop the command with an actionable message when one is missing.
# See docs/deploy.md for the full runbook.

name: baton

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-baton}
      POSTGRES_USER: ${POSTGRES_USER:-baton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      # Detects silent page corruption on read. Only used when the volume is
      # first initialised, so it cannot be added to an existing cluster.
      POSTGRES_INITDB_ARGS: --data-checksums
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # No ports on purpose: reachable only from containers on baton_net.
    # Connect with `docker compose exec postgres psql -U baton baton`.
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    shm_size: 256mb
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 1m
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1g
    networks:
      - baton_net

  baton:
    build:
      context: ..
      dockerfile: Dockerfile.baton
    image: baton:prod
    restart: unless-stopped
    # Reaps orphaned node/nginx children; the entrypoint runs as PID 1.
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # --- URLs (same-origin deployment) ---
      BATON_CLIENT_URL: ${BATON_CLIENT_URL:?set BATON_CLIENT_URL to https://your-domain in deploy/.env.production}
      # Empty means "derive ${BATON_CLIENT_URL}/api" in the entrypoint.
      BATON_API_URL: ${BATON_API_URL:-}
      BATON_INTERNAL_API_URL: ${BATON_INTERNAL_API_URL:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}

      # Behind Caddy the API's socket peer is this container's nginx
      # (127.0.0.1) and one hop further is Caddy, on baton_net. Both hops must
      # be trusted so rate limits and audit logs see the real client address
      # instead of Caddy's. Change this if you change the subnet below.
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-127.0.0.0/8,172.28.0.0/24}

      # --- Database ---
      # Leave DATABASE_URL unset to derive it from POSTGRES_* below (Compose
      # passes an empty value, which the entrypoint treats as unset). Setting
      # DATABASE_URL is the only change needed to move to managed Postgres.
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_DB: ${POSTGRES_DB:-baton}
      POSTGRES_USER: ${POSTGRES_USER:-baton}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      DATABASE_POOL_MAX: ${DATABASE_POOL_MAX:-10}

      # --- Authentication ---
      AUTH_SECRET: ${AUTH_SECRET:?set AUTH_SECRET in deploy/.env.production (openssl rand -base64 32)}
      NOTIFICATION_SECRET_ENCRYPTION_KEY: ${NOTIFICATION_SECRET_ENCRYPTION_KEY:-}
      GITHUB_OAUTH_CLIENT_ID: ${GITHUB_OAUTH_CLIENT_ID:-}
      GITHUB_OAUTH_CLIENT_SECRET: ${GITHUB_OAUTH_CLIENT_SECRET:-}
      GITHUB_APP_ID: ${GITHUB_APP_ID:-}
      GITHUB_APP_NAME: ${GITHUB_APP_NAME:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      GITHUB_PRIVATE_KEY_BASE64: ${GITHUB_PRIVATE_KEY_BASE64:-}

      # --- Email (optional; without SMTP, invitation emails are not sent) ---
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_REQUIRE_TLS: ${SMTP_REQUIRE_TLS:-}
      BATON_EMAIL_ASSETS_URL: ${BATON_EMAIL_ASSETS_URL:-}

      # --- Access policy ---
      DISABLE_REGISTRATION: ${DISABLE_REGISTRATION:-}
      DISABLE_PASSWORD_REGISTRATION: ${DISABLE_PASSWORD_REGISTRATION:-}
      DISABLE_WORKSPACE_CREATION: ${DISABLE_WORKSPACE_CREATION:-}
      BATON_CLOUD: ${BATON_CLOUD:-true}
      BATON_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS: ${BATON_ALLOW_PRIVATE_WEBHOOK_DESTINATIONS:-}

      # --- Uploads (optional; without S3 the attachment feature is unavailable) ---
      S3_ENDPOINT: ${S3_ENDPOINT:-}
      S3_BUCKET: ${S3_BUCKET:-}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
      S3_REGION: ${S3_REGION:-}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-}
      S3_PRESIGN_TTL_SECONDS: ${S3_PRESIGN_TTL_SECONDS:-}
      S3_MAX_IMAGE_UPLOAD_BYTES: ${S3_MAX_IMAGE_UPLOAD_BYTES:-}
      S3_KEY_PREFIX: ${S3_KEY_PREFIX:-}

      # --- Slack (optional) ---
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN:-}
      SLACK_DIGEST_CRON: ${SLACK_DIGEST_CRON:-}
      SLACK_DIGEST_TZ: ${SLACK_DIGEST_TZ:-}

      # --- Error tracking (optional) ---
      SENTRY_DSN: ${SENTRY_DSN:-}
      SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-production}
      SENTRY_RELEASE: ${SENTRY_RELEASE:-}
      SENTRY_TRACES_SAMPLE_RATE: ${SENTRY_TRACES_SAMPLE_RATE:-}
      SENTRY_PROFILES_SAMPLE_RATE: ${SENTRY_PROFILES_SAMPLE_RATE:-}

      # --- Optional Redis fan-out (see the commented service at the bottom) ---
      REDIS_URL: ${REDIS_URL:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    # No ports: Caddy is the only way in, and it proxies to baton:5173.
    healthcheck:
      test:
        ["CMD", "wget", "-Y", "off", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:5173/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "1.5"
          memory: 1g
    networks:
      - baton_net

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      baton:
        condition: service_healthy
    environment:
      BATON_DOMAIN: ${BATON_DOMAIN:?set BATON_DOMAIN in deploy/.env.production (for example tracker.example.com)}
      BATON_ACME_EMAIL: ${BATON_ACME_EMAIL:?set BATON_ACME_EMAIL in deploy/.env.production (Let's Encrypt expiry notices)}
    ports:
      - "80:80"
      - "443:443"
      # HTTP/3. Requires UDP 443 in the firewall to be useful; harmless otherwise.
      - "443:443/udp"
    volumes:
      # Certificates live here. Losing this volume re-issues certificates and
      # can hit Let's Encrypt rate limits.
      - caddy_data:/data
      - caddy_config:/config
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    networks:
      - baton_net
    healthcheck:
      test: ["CMD", "nc", "-z", "127.0.0.1", "443"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128m

  backup:
    build:
      context: ./backup
    image: baton-backup:prod
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Prefer DATABASE_URL (it also follows a move to managed Postgres);
      # otherwise pg_dump uses the PG* variables below.
      DATABASE_URL: ${DATABASE_URL:-}
      # Only for restoring into a different server; drills use a database name
      # argument instead (see deploy/backup/restore.sh).
      RESTORE_DATABASE_URL: ${RESTORE_DATABASE_URL:-}
      PGHOST: ${POSTGRES_HOST:-postgres}
      PGPORT: ${POSTGRES_PORT:-5432}
      PGDATABASE: ${POSTGRES_DB:-baton}
      PGUSER: ${POSTGRES_USER:-baton}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env.production}
      # Destination: any S3-compatible bucket (AWS, Cloudflare R2, Spaces, B2, MinIO).
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:?set BACKUP_S3_BUCKET in deploy/.env.production}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-us-east-1}
      BACKUP_PREFIX: ${BACKUP_PREFIX:-baton/postgres}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Daily run time, UTC (03:15 keeps it off the top of the hour).
      BACKUP_SCHEDULE_UTC: ${BACKUP_SCHEDULE_UTC:-03:15}
      AWS_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:?set BACKUP_S3_ACCESS_KEY_ID in deploy/.env.production}
      AWS_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:?set BACKUP_S3_SECRET_ACCESS_KEY in deploy/.env.production}
    security_opt:
      - no-new-privileges:true
    logging: *logging
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512m
    networks:
      - baton_net

  # Optional: only needed for more than one API instance (live updates then fan
  # out across instances through Redis). One API instance needs no Redis.
  # To use it: uncomment the service, set REDIS_URL=redis://redis:6379 in
  # deploy/.env.production, then start with `--profile redis`.
  #
  # redis:
  #   image: valkey/valkey:8-alpine
  #   restart: unless-stopped
  #   # Pub/sub only: no volume, so nothing survives a restart.
  #   command: ["valkey-server", "--save", "", "--appendonly", "no"]
  #   healthcheck:
  #     test: ["CMD", "valkey-cli", "ping"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 6
  #   security_opt:
  #     - no-new-privileges:true
  #   logging: *logging
  #   profiles: ["redis"]
  #   networks:
  #     - baton_net

volumes:
  postgres_data:
  caddy_data:
  caddy_config:

networks:
  baton_net:
    # Fixed subnet so baton's TRUSTED_PROXIES (172.28.0.0/24) covers exactly
    # this project's containers and nothing else. Change the block if it
    # collides with a network already on the VPS (`docker network ls`).
    ipam:
      config:
        - subnet: 172.28.0.0/24
