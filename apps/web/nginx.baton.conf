# DigitalOcean App Platform puts the client address in `do-connecting-ip` and
# its own ingress address in X-Forwarded-For. Believe the header only when the
# TCP peer is on the platform's private network (10.0.0.0/8): behind Caddy on a
# VPS, or with the port exposed directly, a client could set it to anything.
geo $baton_platform_peer {
    default 0;
    10.0.0.0/8 1;
}

# The validated client address from the platform, or "" to keep the normal
# X-Forwarded-For chain. A value that is not one IP address is ignored.
map "$baton_platform_peer:$http_do_connecting_ip" $baton_platform_client {
    default "";
    "~^1:((25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9][0-9]|[1-9]?[0-9])$" $http_do_connecting_ip;
    "~^1:([0-9A-Fa-f]{0,4}:){2,7}[0-9A-Fa-f]{0,4}$" $http_do_connecting_ip;
}

# Hand the API exactly one hop, so its TRUSTED_PROXIES walk (nginx on
# 127.0.0.1 -> client) ends at the platform's client address.
map $baton_platform_client $baton_forwarded_for {
    "" $proxy_add_x_forwarded_for;
    default $baton_platform_client;
}

map $baton_platform_client $baton_real_ip {
    "" $remote_addr;
    default $baton_platform_client;
}

server {
    listen 5173;
    server_name localhost;

    # The API logs its own requests; per-request lines and health probes from
    # nginx would interleave with them in the same container output.
    access_log off;

    # Allow larger OAuth/Better Auth session cookies in request headers.
    client_header_buffer_size 8k;
    large_client_header_buffers 4 32k;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-protected-resource/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Baton-Client-IP "";
        proxy_set_header do-connecting-ip "";
        proxy_set_header X-Real-IP $baton_real_ip;
        proxy_set_header X-Forwarded-For $baton_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server/api {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-authorization-server/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Baton-Client-IP "";
        proxy_set_header do-connecting-ip "";
        proxy_set_header X-Real-IP $baton_real_ip;
        proxy_set_header X-Forwarded-For $baton_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header CF-Connecting-IP "";
        proxy_set_header X-Baton-Client-IP "";
        proxy_set_header do-connecting-ip "";
        proxy_set_header X-Real-IP $baton_real_ip;
        proxy_set_header X-Forwarded-For $baton_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Defense in depth if a build leaves a source map in the static directory.
    location ~* \.map$ {
        return 404;
    }

    location / {
        root /var/lib/baton/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
