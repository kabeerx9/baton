name: CI

# Lint/typecheck and a Docker build of the bundled image.
# Tests are not run in CI by choice: run unit and API integration tests with
# `pnpm test` and `pnpm test:integration` locally instead (see AGENTS.md,
# "Verifying"). The e2e (tests/e2e) and storage-integration
# (tests/storage-integration) suites need a browser and extra services.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # The newest run for a ref is the one that matters, on branches and main.
  cancel-in-progress: true

jobs:
  check:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # pnpm/action-setup reads `packageManager` from package.json (pnpm@12.18.0)
      # so the lockfile and CI always agree.
      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v4
        with:
          # Matches Dockerfile.baton; package.json engines requires Node 24.
          node-version: 24.22.2
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      # Workspace builds are part of the typecheck task graph, so no separate
      # `pnpm build:dependencies` step is needed here.
      - run: pnpm typecheck

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Build only: proves the bundled image still compiles.
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.baton
          push: false
          tags: baton:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
