name: Backup

# Nightly pg_dump of the hosted database to S3-compatible storage.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL         Supabase session-pooler URL, sslmode=require
#   BACKUP_S3_BUCKET            bucket holding baton/<UTC stamp>.dump
#   BACKUP_S3_ENDPOINT          optional, for Spaces/R2/MinIO
#   BACKUP_S3_ACCESS_KEY_ID
#   BACKUP_S3_SECRET_ACCESS_KEY
#
# Set a bucket lifecycle rule (for example, expire baton/ after 14 days)
# instead of pruning here.
#
# Restore: aws s3 cp s3://$BACKUP_S3_BUCKET/baton/<stamp>.dump .
#   psql "$BACKUP_DATABASE_URL" -c 'CREATE DATABASE baton_restore'
#   pg_restore --dbname "${BACKUP_DATABASE_URL%/*}/baton_restore" --clean --if-exists --no-owner --no-privileges --exit-on-error <stamp>.dump

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    steps:
      - name: Dump and upload
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${BACKUP_DATABASE_URL}" ]; then
            echo "::notice::BACKUP_DATABASE_URL is not set; skipping the backup."
            exit 0
          fi

          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          dump="$RUNNER_TEMP/baton-$stamp.dump"
          docker run --rm --volume "$RUNNER_TEMP:/backup" postgres:17 \
            pg_dump --format=custom --no-owner --no-privileges \
            --schema=public --schema=drizzle \
            --file="/backup/baton-$stamp.dump" "$BACKUP_DATABASE_URL"

          if [ -n "${BACKUP_S3_ENDPOINT}" ]; then
            aws s3 cp --endpoint-url "$BACKUP_S3_ENDPOINT" "$dump" \
              "s3://$BACKUP_S3_BUCKET/baton/$stamp.dump" --only-show-errors
          else
            aws s3 cp "$dump" "s3://$BACKUP_S3_BUCKET/baton/$stamp.dump" --only-show-errors
          fi
          echo "backup: uploaded s3://$BACKUP_S3_BUCKET/baton/$stamp.dump"
