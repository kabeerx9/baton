name: Backup

# Nightly pg_dump of the production database (Supabase Postgres, reached over
# its session-pooler URL) to S3-compatible storage, then prune old dumps.
#
# Secrets (Settings -> Secrets and variables -> Actions):
#   BACKUP_DATABASE_URL         Supabase session-pooler URL, sslmode=require
#                               (the transaction pooler on :6543 cannot pg_dump)
#   BACKUP_S3_BUCKET            destination bucket
#   BACKUP_S3_ENDPOINT          optional, for Spaces/R2/MinIO
#   BACKUP_S3_REGION            optional, default us-east-1
#   BACKUP_S3_ACCESS_KEY_ID     key allowed put/list/delete on that bucket only
#   BACKUP_S3_SECRET_ACCESS_KEY
#   BACKUP_PREFIX               optional, default baton/postgres
#   BACKUP_RETENTION_DAYS       optional, default 14, 0 disables pruning
#
# Restore (same bucket credentials; pg_restore 17 matches this dump):
#   aws [--endpoint-url "$BACKUP_S3_ENDPOINT"] --region "$BACKUP_S3_REGION" \
#     s3 cp s3://$BACKUP_S3_BUCKET/${BACKUP_PREFIX:-baton/postgres}/<stamp>.dump .
#   psql "${BACKUP_DATABASE_URL%/*}/postgres" -c 'CREATE DATABASE baton_restore'
#   pg_restore --dbname "${BACKUP_DATABASE_URL%/*}/baton_restore" \
#     --clean --if-exists --no-owner --no-privileges --exit-on-error <stamp>.dump
# Create the target on the same Supabase project and never restore over the
# live one. The dump holds public and drizzle only; the target project already
# provides auth, storage, realtime, extensions and the other managed schemas.

on:
  schedule:
    # 03:15 UTC, the same quiet hour the self-hosted backup sidecar uses.
    - cron: "15 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Never let a slow dump overlap the next night's run; queue instead of cancel.
  group: backup-production
  cancel-in-progress: false

jobs:
  backup:
    name: pg_dump to S3
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_S3_REGION: ${{ secrets.BACKUP_S3_REGION || 'us-east-1' }}
      BACKUP_PREFIX: ${{ secrets.BACKUP_PREFIX || 'baton/postgres' }}
      BACKUP_RETENTION_DAYS: ${{ secrets.BACKUP_RETENTION_DAYS || '14' }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: ${{ secrets.BACKUP_S3_REGION || 'us-east-1' }}
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
    steps:
      - name: Check configuration
        id: config
        run: |
          set -eu

          if [ -z "${BACKUP_DATABASE_URL:-}" ]; then
            echo "::notice title=Backup skipped::BACKUP_DATABASE_URL is not set, so there is nothing to back up."
            echo "configured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          : "${BACKUP_S3_BUCKET:?BACKUP_S3_BUCKET must be set when BACKUP_DATABASE_URL is set}"

          retention="${BACKUP_RETENTION_DAYS:-14}"
          case "$retention" in
            '' | *[!0-9]*)
              echo "::error::BACKUP_RETENTION_DAYS must be a whole number of days"
              exit 1
              ;;
          esac

          prefix="${BACKUP_PREFIX:-baton/postgres}"
          prefix="${prefix%/}"
          {
            echo "configured=true"
            echo "prefix=$prefix"
            echo "retention_days=$retention"
          } >> "$GITHUB_OUTPUT"

      # pg_dump must be at least the server's major version. Supabase projects
      # run 15 or 17, so use the 17 client image and log what it connects to.
      - name: Log server version
        if: steps.config.outputs.configured == 'true'
        run: |
          set -eu
          docker run --rm --env BACKUP_DATABASE_URL postgres:17 \
            psql --no-psqlrc --no-align --tuples-only \
            --command "SELECT version()" "$BACKUP_DATABASE_URL"

      - name: Dump database
        id: dump
        if: steps.config.outputs.configured == 'true'
        run: |
          set -eu
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          name="baton-$stamp.dump"
          {
            echo "stamp=$stamp"
            echo "name=$name"
          } >> "$GITHUB_OUTPUT"

          # Exclude the schemas Supabase manages so a restore only has to bring
          # back what Baton owns: public data and the drizzle migration ledger.
          docker run --rm \
            --volume "$RUNNER_TEMP:/backup" \
            --env BACKUP_DATABASE_URL \
            postgres:17 \
            pg_dump --format=custom --no-owner --no-privileges \
            --exclude-schema=auth \
            --exclude-schema=storage \
            --exclude-schema=realtime \
            --exclude-schema=extensions \
            --exclude-schema=graphql \
            --exclude-schema=graphql_public \
            --exclude-schema=pgsodium \
            --exclude-schema=pgsodium_masks \
            --exclude-schema=vault \
            --exclude-schema=net \
            --exclude-schema=cron \
            --exclude-schema=pgmq \
            --exclude-schema=supabase_functions \
            --exclude-schema=supabase_migrations \
            --exclude-schema=_analytics \
            --exclude-schema=_realtime \
            --exclude-schema=_supabase \
            --file="/backup/$name" \
            "$BACKUP_DATABASE_URL"

          bytes="$(wc -c <"$RUNNER_TEMP/$name" | tr -d ' ')"
          echo "bytes=$bytes" >> "$GITHUB_OUTPUT"
          echo "backup: dumped $name ($bytes bytes)"
          test "$bytes" -gt 0

      # A truncated or corrupt dump is worse than a failed job: check the
      # archive reads as a TOC before it ever leaves the runner.
      - name: Verify dump
        if: steps.config.outputs.configured == 'true'
        run: |
          set -eu
          name="${{ steps.dump.outputs.name }}"
          docker run --rm --volume "$RUNNER_TEMP:/backup" postgres:17 \
            pg_restore --list "/backup/$name" > "$RUNNER_TEMP/toc.txt"
          entries="$(grep -c '^[0-9]' "$RUNNER_TEMP/toc.txt" || true)"
          echo "backup: verified $name ($entries TOC entries)"
          test "$entries" -gt 0
          # The exclusions must leave the two schemas we own intact.
          grep -q 'SCHEMA - drizzle' "$RUNNER_TEMP/toc.txt"
          grep -q 'TABLE public ' "$RUNNER_TEMP/toc.txt"

      # Upload and retention keep the same rules as deploy/backup/backup.sh:
      # one object per UTC stamp under the prefix, prune by LastModified.
      - name: Upload and prune old dumps
        if: steps.config.outputs.configured == 'true'
        run: |
          set -eu

          s3() {
            if [ -n "${BACKUP_S3_ENDPOINT:-}" ]; then
              aws --endpoint-url "$BACKUP_S3_ENDPOINT" --region "$AWS_DEFAULT_REGION" "$@"
            else
              aws --region "$AWS_DEFAULT_REGION" "$@"
            fi
          }

          name="${{ steps.dump.outputs.name }}"
          key="${{ steps.config.outputs.prefix }}/${{ steps.dump.outputs.stamp }}.dump"
          s3 s3 cp "$RUNNER_TEMP/$name" "s3://$BACKUP_S3_BUCKET/$key" --only-show-errors
          echo "backup: uploaded s3://$BACKUP_S3_BUCKET/$key (${{ steps.dump.outputs.bytes }} bytes)"

          retention="${{ steps.config.outputs.retention_days }}"
          if [ "$retention" -gt 0 ]; then
            # ISO 8601 timestamps sort by time as plain strings, which is all this needs.
            cutoff="$(date -u -d "@$(( $(date -u +%s) - retention * 86400 ))" +%Y-%m-%dT%H:%M:%S)"
            # The dump is already uploaded, so a listing or delete failure only
            # breaks retention; surface it instead of letting the bucket grow.
            s3 s3api list-objects-v2 --bucket "$BACKUP_S3_BUCKET" \
              --prefix "${{ steps.config.outputs.prefix }}/" \
              --query 'Contents[].[Key,LastModified]' --output text |
              awk -v cutoff="$cutoff" '$2 < cutoff { print $1 }' |
              while read -r expired; do
                [ -n "$expired" ] || continue
                s3 s3api delete-object --bucket "$BACKUP_S3_BUCKET" --key "$expired" >/dev/null
                echo "backup: removed expired s3://$BACKUP_S3_BUCKET/$expired"
              done
          fi
