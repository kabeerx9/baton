# DigitalOcean App Platform spec for Baton (hosted instance).
#
# One service, the prebuilt image from GHCR (built from Dockerfile.baton by
# .github/workflows/ci.yml when main moves): nginx serves the web build on 5173
# and proxies /api and the WebSocket upgrade to the Node API on 1337. The
# database is an external Supabase Postgres (see docs/deploy.md), not an App
# Platform database, so nothing here provisions or bills a managed cluster.
#
#   doctl apps spec validate .do/app.yaml
#   doctl apps create --spec .do/app.yaml

name: baton

# Match the Supabase region. nyc pairs with Supabase East US (North Virginia,
# us-east-1) because most of the team is in the US; sfo pairs with
# us-west-1 if that changes. Never split the two: every API request crosses
# between app and database.
region: nyc

alerts:
  - rule: DEPLOYMENT_FAILED

ingress:
  rules:
    # One component serves both the web app and the API, same origin.
    - match:
        path:
          prefix: /
      component:
        name: baton

services:
  - name: baton
    image:
      registry_type: GHCR
      registry: kabeerx9
      repository: baton
      tag: latest
    http_port: 5173

    # Keep this at 1. Live updates, the event bus and the scheduler live in one
    # process's memory. More than one instance needs Redis first: uncomment
    # REDIS_URL below (and set DATABASE_POOL_MAX so the instances together stay
    # under Supabase's connection limit).
    instance_count: 1
    # 1 vCPU / 1 GB: leaves room for a migration run and for Node's heap.
    instance_size_slug: apps-s-1vcpu-1gb

    health_check:
      http_path: /api/health
      # The API runs its migrations before it serves traffic (and exits if they
      # fail), so give the first boot on an empty database room to finish.
      initial_delay_seconds: 180
      period_seconds: 30
      timeout_seconds: 10
      failure_threshold: 5
      success_threshold: 1

    envs:
      # --- URLs (same-origin deployment) ---
      - key: BATON_CLIENT_URL
        scope: RUN_TIME
        value: "${APP_URL}"

      # --- Database (Supabase session pooler, port 5432, sslmode=no-verify) ---
      - key: DATABASE_URL
        scope: RUN_TIME
        type: SECRET
      - key: DATABASE_POOL_MAX
        scope: RUN_TIME
        value: "10"

      # --- Authentication: generate with openssl rand -base64 32, never change ---
      - key: AUTH_SECRET
        scope: RUN_TIME
        type: SECRET
      - key: NOTIFICATION_SECRET_ENCRYPTION_KEY
        scope: RUN_TIME
        type: SECRET

      # --- Access policy ---
      # "false" until the first account has signed up, then "true".
      - key: DISABLE_REGISTRATION
        scope: RUN_TIME
        value: "true"
      - key: BATON_CLOUD
        scope: RUN_TIME
        value: "true"
      - key: TRUSTED_PROXIES
        scope: RUN_TIME
        value: "127.0.0.0/8,10.0.0.0/8"

      # --- Slack digest ---
      - key: SLACK_BOT_TOKEN
        scope: RUN_TIME
        type: SECRET
      - key: SLACK_DIGEST_TIME
        scope: RUN_TIME
        value: "10:00"
      - key: SLACK_DIGEST_TZ
        scope: RUN_TIME
        value: "America/New_York"

      # --- Error tracking ---
      - key: SENTRY_ENVIRONMENT
        scope: RUN_TIME
        value: "production"

      # Optional and not set on the live app. An empty value makes the
      # dashboard's App Spec update fail, so add these only with real values.
      #   SMTP_HOST, SMTP_PORT, SMTP_SECURE, SMTP_USER, SMTP_FROM,
      #   SMTP_REQUIRE_TLS, SMTP_PASSWORD (secret), BATON_EMAIL_ASSETS_URL
      #   S3_ENDPOINT, S3_BUCKET, S3_ACCESS_KEY_ID/S3_SECRET_ACCESS_KEY (secrets),
      #   S3_REGION, S3_FORCE_PATH_STYLE, S3_MAX_IMAGE_UPLOAD_BYTES,
      #   S3_PRESIGN_TTL_SECONDS, S3_KEY_PREFIX
      #   GITHUB_OAUTH_CLIENT_ID, GITHUB_OAUTH_CLIENT_SECRET (secret),
      #   GITHUB_APP_ID, GITHUB_APP_NAME, GITHUB_WEBHOOK_SECRET (secret),
      #   GITHUB_PRIVATE_KEY_BASE64 (secret)
      #   SENTRY_DSN (secret), SENTRY_RELEASE
      #   REDIS_URL (secret), only when instance_count is above 1
